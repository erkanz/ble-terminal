name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    name: Windows x64 self-contained
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare application icon
        shell: pwsh
        run: ./scripts/prepare-icon.ps1

      - name: Static regression checks
        shell: pwsh
        run: python tests/STATIC_REGRESSION_CHECK.py

      - name: Restore
        shell: pwsh
        run: dotnet restore BLESerialTerminal.csproj -r win-x64

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >-
          dotnet publish BLESerialTerminal.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/win-x64

      - name: Verify EXE and generate SHA-256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-x64/BLESerialTerminal.exe'
          if (-not (Test-Path $exe)) {
            throw "BLESerialTerminal.exe was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BLESerialTerminal.exe" | Set-Content -Encoding ascii 'dist/win-x64/BLESerialTerminal.exe.sha256'
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content 'dist/win-x64/BLESerialTerminal.exe.sha256'

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLESerialTerminal-win-x64
          path: |
            dist/win-x64/BLESerialTerminal.exe
            dist/win-x64/BLESerialTerminal.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/win-x64/BLESerialTerminal.exe" `
            "dist/win-x64/BLESerialTerminal.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "BLE Serial Terminal ${{ github.ref_name }}" `
            --generate-notes
