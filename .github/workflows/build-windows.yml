name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    name: Windows x64 self-contained
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare application icon
        shell: pwsh
        run: ./scripts/prepare-icon.ps1

      - name: Static regression checks
        shell: pwsh
        run: python tests/STATIC_REGRESSION_CHECK.py

      - name: Optional RT950 KISS module static checks
        shell: pwsh
        run: python tests/OPTIONAL_MODULES_STATIC_CHECK.py

      - name: USB serial and RTX1 static checks
        shell: pwsh
        run: python tests/USB_SERIAL_STATIC_CHECK.py

      - name: Phase F GATT snapshot static checks
        shell: pwsh
        run: python tests/PHASE_F_STATIC_CHECK.py

      - name: Phase G KISS TCP bridge static checks
        shell: pwsh
        run: python tests/PHASE_G_STATIC_CHECK.py

      - name: Phase H multi-device isolation static checks
        shell: pwsh
        run: python tests/PHASE_H_STATIC_CHECK.py

      - name: Phase I production hardening static checks
        shell: pwsh
        run: python tests/PHASE_I_STATIC_CHECK.py

      - name: Protocol decoder tests
        shell: pwsh
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release

      - name: Notification capture tests
        shell: pwsh
        run: dotnet run --project tests/NotificationTests/NotificationTests.csproj -c Release

      - name: Log filter tests
        shell: pwsh
        run: dotnet run --project tests/LogFilterTests/LogFilterTests.csproj -c Release

      - name: Session capture replay tests
        shell: pwsh
        run: dotnet run --project tests/SessionTests/SessionTests.csproj -c Release

      - name: Manual GATT TX tests
        shell: pwsh
        run: dotnet run --project tests/ManualTxTests/ManualTxTests.csproj -c Release

      - name: Optional RT950 KISS feature module tests
        shell: pwsh
        run: dotnet run --project tests/FeatureModuleTests/FeatureModuleTests.csproj -c Release

      - name: GATT snapshot compare tests
        shell: pwsh
        run: dotnet run --project tests/GattSnapshotTests/GattSnapshotTests.csproj -c Release

      - name: KISS TCP bridge tests
        shell: pwsh
        run: dotnet run --project tests/KissTcpBridgeTests/KissTcpBridgeTests.csproj -c Release

      - name: Multi-device compare tests
        shell: pwsh
        run: dotnet run --project tests/MultiDeviceCompareTests/MultiDeviceCompareTests.csproj -c Release

      - name: Restore
        shell: pwsh
        run: dotnet restore BLESerialTerminal.csproj -r win-x64

      - name: Compiler warnings gate
        shell: pwsh
        run: >-
          dotnet build BLESerialTerminal.csproj
          -c Release
          -r win-x64
          --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >-
          dotnet publish BLESerialTerminal.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/win-x64

      - name: Published EXE startup smoke gate
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-x64/BLESerialTerminal.exe'
          if (-not (Test-Path $exe)) {
            throw "BLESerialTerminal.exe was not produced"
          }

          $process = $null
          try {
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Published EXE exited during startup smoke test. Exit code: $($process.ExitCode)"
            }
            Write-Host "STARTUP SMOKE PASS: process remained alive after MainWindow initialization window."
          }
          finally {
            if ($process -ne $null) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
                }
              }
              catch {
                Write-Host "Startup smoke cleanup warning: $($_.Exception.Message)"
              }
            }
          }

      - name: Verify EXE and generate SHA-256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-x64/BLESerialTerminal.exe'
          if (-not (Test-Path $exe)) {
            throw "BLESerialTerminal.exe was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BLESerialTerminal.exe" | Set-Content -Encoding ascii 'dist/win-x64/BLESerialTerminal.exe.sha256'
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content 'dist/win-x64/BLESerialTerminal.exe.sha256'

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLESerialTerminal-win-x64
          path: |
            dist/win-x64/BLESerialTerminal.exe
            dist/win-x64/BLESerialTerminal.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/win-x64/BLESerialTerminal.exe" `
            "dist/win-x64/BLESerialTerminal.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "BLE Serial Terminal ${{ github.ref_name }}" `
            --generate-notes
