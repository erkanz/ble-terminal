name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    name: Windows x64 self-contained
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap imported v13 source tree
        id: bootstrap
        shell: pwsh
        run: |
          $chunkNames = @(
            'source_remaining.zip.b64.001',
            'source_remaining.zip.b64.002',
            'source_remaining.zip.b64.003',
            'source_remaining.zip.b64.004',
            'source_remaining.zip.b64.005',
            'source_remaining.zip.b64.006',
            'source_remaining.zip.b64.007a',
            'source_remaining.zip.b64.007b',
            'source_remaining.zip.b64.008',
            'source_remaining.zip.b64.009'
          )
          $firstChunk = Join-Path $PWD ('bootstrap/' + $chunkNames[0])
          if (Test-Path $firstChunk) {
            $chunks = foreach ($name in $chunkNames) {
              $path = Join-Path $PWD ('bootstrap/' + $name)
              if (-not (Test-Path $path)) { throw "Missing bootstrap chunk: $name" }
              (Get-Content -Raw $path).Trim()
            }
            $b64 = $chunks -join ''
            if (($b64.Length % 4) -ne 0) { throw "Invalid bootstrap base64 length: $($b64.Length)" }
            $zip = Join-Path $PWD 'bootstrap/source_remaining.zip'
            [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
            Expand-Archive -Path $zip -DestinationPath $PWD -Force
            Remove-Item $zip -Force
            "materialized=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Imported v13 source tree materialized from bootstrap archive."
          }
          else {
            "materialized=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Restore verified GATT Inspector source
        if: steps.bootstrap.outputs.materialized == 'true'
        shell: pwsh
        run: |
          $patchParts = @(
            'bootstrap/GattInspectorWindow.xaml.cs.gz.b64.001',
            'bootstrap/GattInspectorWindow.xaml.cs.gz.b64.002'
          )
          $b64 = ($patchParts | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing verified source patch: $_" }
            (Get-Content -Raw $_).Trim()
          }) -join ''
          $gzBytes = [Convert]::FromBase64String($b64)
          $input = New-Object IO.MemoryStream(,$gzBytes)
          $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create((Join-Path $PWD 'GattInspectorWindow.xaml.cs'))
          try {
            $gzip.CopyTo($output)
          }
          finally {
            $output.Dispose()
            $gzip.Dispose()
            $input.Dispose()
          }
          Write-Host "Verified GattInspectorWindow.xaml.cs restored."

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare application icon
        shell: pwsh
        run: ./scripts/prepare-icon.ps1

      - name: Static regression checks
        shell: pwsh
        run: python tests/STATIC_REGRESSION_CHECK.py

      - name: Restore
        shell: pwsh
        run: dotnet restore BLESerialTerminal.csproj -r win-x64

      - name: Publish self-contained single EXE
        shell: pwsh
        run: >-
          dotnet publish BLESerialTerminal.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/win-x64

      - name: Verify EXE and generate SHA-256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-x64/BLESerialTerminal.exe'
          if (-not (Test-Path $exe)) {
            throw "BLESerialTerminal.exe was not produced"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BLESerialTerminal.exe" | Set-Content -Encoding ascii 'dist/win-x64/BLESerialTerminal.exe.sha256'
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content 'dist/win-x64/BLESerialTerminal.exe.sha256'

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLESerialTerminal-win-x64
          path: |
            dist/win-x64/BLESerialTerminal.exe
            dist/win-x64/BLESerialTerminal.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Materialize imported source files into main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bootstrap.outputs.materialized == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.xaml MainWindow.xaml MainWindow.xaml.cs GattInspectorWindow.xaml GattInspectorWindow.xaml.cs `
            SELF_CONTAINED_BUILD.txt BUILD_UBUNTU_COMMANDS.txt SCROLLBAR_DARK_FIX.txt GATT_INSPECTOR_NOTES.txt `
            V12_UI_MENU_CHANGES.txt V13_RT950_GATT_CACHE_FIX.txt RT950_TEST_CHECKLIST.txt
          Get-ChildItem bootstrap -Filter 'source_remaining.zip.b64.*' | ForEach-Object { git rm -f -- $_.FullName }
          Get-ChildItem bootstrap -Filter 'GattInspectorWindow.xaml.cs.gz.b64.*' | ForEach-Object { git rm -f -- $_.FullName }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source materialization changes to commit."
            exit 0
          }
          git commit -m "Materialize v13 BLE Serial Terminal source tree"
          git push origin HEAD:main

      - name: Publish tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/win-x64/BLESerialTerminal.exe" `
            "dist/win-x64/BLESerialTerminal.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "BLE Serial Terminal ${{ github.ref_name }}" `
            --generate-notes
